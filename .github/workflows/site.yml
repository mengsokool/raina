name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/site.yml
      - apps/site/**
      - apps/web/src/routes/automations/canvas/BlockNode.tsx
      - apps/web/src/routes/automations/utils/block-icons.tsx
      - apps/web/src/routes/dashboards/components/share-access-options.ts
      - apps/web/src/routes/dashboards/widgets/**
      - packages/workflow/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

concurrency:
  group: site-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @raina/workflow build
      - run: pnpm --filter @raina/site test
      - run: pnpm --filter @raina/site build
      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler@4.142.0 pages deploy apps/site/build/client --project-name=raina --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
