services:
  postgres:
    image: postgres:17-alpine
    container_name: raina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-raina}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raina} -d ${POSTGRES_DB:-raina}"]
      interval: 5s
      timeout: 5s
      retries: 5

  emqx:
    image: emqx/emqx:5.8.5
    container_name: raina-emqx
    restart: unless-stopped
    environment:
      EMQX_NODE_NAME: "raina@node1"
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME:?Set EMQX_DASHBOARD_USERNAME in .env}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?Set EMQX_DASHBOARD_PASSWORD in .env}
    ports:
      - "1883:1883"   # MQTT TCP (Direct for IoT devices)
      # Browser MQTT WebSocket is proxied by Caddy.
    volumes:
      - emqx_data:/opt/emqx/data
      - ./docker/emqx/base.hocon:/opt/emqx/etc/base.hocon:ro

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: ${SERVER_IMAGE:-raina-server:latest}
    container_name: raina-server
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-raina}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-raina}?schema=public
      EMQX_BROKER_URL: mqtt://emqx:1883
      EMQX_API_URL: http://emqx:18083
      EMQX_DASHBOARD_USERNAME: ${EMQX_DASHBOARD_USERNAME:?Set EMQX_DASHBOARD_USERNAME in .env}
      EMQX_DASHBOARD_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?Set EMQX_DASHBOARD_PASSWORD in .env}
      EMQX_SERVER_PASSWORD: ${EMQX_SERVER_PASSWORD:?Set EMQX_SERVER_PASSWORD in .env}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN in .env}
      EMQX_AUTH_WEBHOOK_URL: http://server:3001/v1/emqx/auth
      EMQX_ACL_WEBHOOK_URL: http://server:3001/v1/emqx/acl
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL in .env}
      PUBLIC_MQTT_HOST: ${PUBLIC_MQTT_HOST:?Set PUBLIC_MQTT_HOST in .env}
      PUBLIC_MQTT_WS_URL: ${PUBLIC_MQTT_WS_URL:?Set PUBLIC_MQTT_WS_URL in .env}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      AUTO_SEED: ${AUTO_SEED:-false}
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        INTERNAL_API_URL: http://server:3001
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL in .env}
        NEXT_PUBLIC_MQTT_HOST: ${PUBLIC_MQTT_HOST:?Set PUBLIC_MQTT_HOST in .env}
    image: ${WEB_IMAGE:-raina-web:latest}
    container_name: raina-web
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      INTERNAL_API_URL: http://server:3001
    expose:
      - "3000"
    depends_on:
      - server

  caddy:
    image: caddy:2-alpine
    container_name: raina-caddy
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
      MQTT_DOMAIN: ${MQTT_DOMAIN:?Set MQTT_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - server

volumes:
  postgres_data:
  emqx_data:
  caddy_data:
  caddy_config:
