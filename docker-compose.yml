services:
  postgres:
    # Keep the PostgreSQL major version aligned when changing this image: an
    # existing PostgreSQL 17 data volume is compatible with the pg17 image.
    image: ${POSTGRES_IMAGE:-timescale/timescaledb:2.30.0-pg17}
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    container_name: raina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rainasecret}
      POSTGRES_DB: ${POSTGRES_DB:-raina}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raina} -d ${POSTGRES_DB:-raina}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: raina-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: raina-server
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-raina}:${POSTGRES_PASSWORD:-rainasecret}@postgres:5432/${POSTGRES_DB:-raina}?schema=public
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      PUBLIC_RLP_HOST: ${PUBLIC_RLP_HOST:-}
      PUBLIC_RLP_PORT: ${PUBLIC_RLP_PORT:-9000}
      PUBLIC_RLP_TLS: ${PUBLIC_RLP_TLS:-false}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      WS_TICKET_SECRET: ${WS_TICKET_SECRET:-}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      AUTO_SEED: ${AUTO_SEED:-false}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TIMESCALE_ENABLED: ${TIMESCALE_ENABLED:-true}
      TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:-30}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  rlp-gateway:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: raina-rlp-gateway
    restart: unless-stopped
    command: ["node", "apps/server/dist/rlp-gateway.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-raina}:${POSTGRES_PASSWORD:-rainasecret}@postgres:5432/${POSTGRES_DB:-raina}?schema=public
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      RLP_PORT: 9000
      RLP_REQUIRE_TLS: "false"
      RLP_REQUIRE_REDIS: "true"
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        INTERNAL_API_URL: http://server:3001
    container_name: raina-web
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      INTERNAL_API_URL: http://server:3001
    ports:
      - "3000:3000"
    depends_on:
      - server

  caddy:
    image: caddy:2-alpine
    container_name: raina-caddy
    restart: unless-stopped
    profiles:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - server

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
